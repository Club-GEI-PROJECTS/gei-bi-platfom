# Version développement avec hot-reload
services:
  postgres:
    image: postgres:15-alpine
    container_name: gei-bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gei_bi_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gei-bi-network

  # Application NestJS (optionnel - pour exécuter dans Docker)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gei-bi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=gei_bi_platform
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gei-bi-network
    command: npm run start:dev

volumes:
  postgres_data:
    driver: local

networks:
  gei-bi-network:
    driver: bridge

