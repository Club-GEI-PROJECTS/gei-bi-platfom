services:
  postgres:
    image: postgres:15-alpine
    container_name: gei-bi-postgres
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gei_bi_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gei_bi_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gei-bi-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gei-bi-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'  # Indique qu'on est dans Docker, ignore le fichier .env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: gei_bi_platform
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.env  # Exclure le fichier .env local pour utiliser les variables Docker
    networks:
      - gei-bi-network
    restart: unless-stopped
    command: npm run start:dev

  adminer:
    image: adminer:latest
    container_name: gei-bi-adminer
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - gei-bi-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gei-bi-pgadmin
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gei-bi-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  gei-bi-network:
    driver: bridge
